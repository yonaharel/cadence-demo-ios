# Builds the Android app in android/: pitch tests, debug APK (attached to the run) and Android Lint.
name: Android

on:
  push:
    branches: [claude/android-version-setup-llr4nx]
    paths: [android/**, .github/workflows/android.yml]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: twang-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
