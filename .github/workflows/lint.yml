# Fails a pull request whose Swift isn't formatted. Fix locally with: make format
name: Lint

on:
  pull_request:

jobs:
  lint:
    runs-on: xcode-27 # same swift-format as the Build workflow
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - run: make lint
