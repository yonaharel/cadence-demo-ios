# Fails a pull request whose Swift isn't formatted. Fix locally with: make format
name: Lint

on:
  pull_request:
    # Only when code or the lint setup changes; docs and metadata PRs skip the macOS runner.
    paths:
      - "**.swift"
      - .swift-format
      - Makefile
      - .github/workflows/lint.yml

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: make lint
