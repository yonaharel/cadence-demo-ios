name: CadenceDemo
options:
  bundleIdPrefix: com.yonaharel
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
targets:
  CadenceDemo:
    type: application
    platform: iOS
    sources: [CadenceDemo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yonaharel.cadencedemo
        DEVELOPMENT_TEAM: T783FPJSM6
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tuner
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Tuner listens to your guitar to show which note you are playing. Audio is analysed on your iPhone and never recorded or sent anywhere."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
